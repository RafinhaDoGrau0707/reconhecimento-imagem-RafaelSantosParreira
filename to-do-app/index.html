<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .task-done {
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center p-4 selection:bg-indigo-500/30">

    <!-- Tela de Login -->
    <div id="login-screen" class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl transition-all duration-300 self-center hidden">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Bem-vindo de volta</h1>
            <p class="text-slate-400">Entre na sua conta para gerenciar suas tarefas</p>
        </div>
        
        <form id="login-form" class="space-y-6">
            <div id="login-error" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg text-center font-medium"></div>
            
            <div>
                <label for="login-email" class="block text-sm font-medium text-slate-300 mb-2">E-mail</label>
                <input type="email" id="login-email" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="seu@email.com">
            </div>
            
            <div>
                <label for="login-password" class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                <input type="password" id="login-password" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 shadow-lg shadow-indigo-500/25">
                Entrar
            </button>
        </form>
        
        <p class="mt-6 text-center text-sm text-slate-400">
            Não tem uma conta? 
            <button id="show-register" type="button" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Cadastre-se</button>
        </p>
    </div>

    <!-- Tela de Cadastro -->
    <div id="register-screen" class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl transition-all duration-300 self-center hidden">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Criar conta</h1>
            <p class="text-slate-400">Comece a organizar suas tarefas hoje</p>
        </div>
        
        <form id="register-form" class="space-y-6">
            <div id="register-error" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg text-center font-medium"></div>
            
            <div>
                <label for="register-name" class="block text-sm font-medium text-slate-300 mb-2">Nome completo</label>
                <input type="text" id="register-name" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="João Silva">
            </div>

            <div>
                <label for="register-email" class="block text-sm font-medium text-slate-300 mb-2">E-mail</label>
                <input type="email" id="register-email" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="seu@email.com">
            </div>
            
            <div>
                <label for="register-password" class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                <input type="password" id="register-password" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 shadow-lg shadow-indigo-500/25">
                Cadastrar
            </button>
        </form>
        
        <p class="mt-6 text-center text-sm text-slate-400">
            Já tem uma conta? 
            <button id="show-login" type="button" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Fazer login</button>
        </p>
    </div>

    <!-- Tela do Dashboard -->
    <div id="dashboard-screen" class="w-full max-w-4xl flex flex-col hidden transition-all duration-300 mt-4">
        <header class="glass flex items-center justify-between p-6 rounded-2xl mb-8 shadow-lg">
            <div>
                <h1 id="user-greeting" class="text-2xl font-bold text-white tracking-tight">Olá, Usuário</h1>
                <p class="text-slate-400 text-sm mt-1">Gerencie suas tarefas de hoje</p>
            </div>
            <button id="logout-btn" class="bg-slate-800/80 hover:bg-red-500/20 border border-slate-600 hover:border-red-500/50 text-slate-200 hover:text-red-400 px-5 py-2.5 rounded-lg transition-colors text-sm font-medium">
                Sair
            </button>
        </header>
        
        <main class="flex-1 flex flex-col gap-8">
            <!-- Formulário de Criação -->
            <section class="glass p-6 rounded-2xl shadow-lg">
                <h2 class="text-lg font-semibold text-white mb-4">Nova Tarefa</h2>
                <form id="todo-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-2">
                            <label for="todo-title" class="block text-sm font-medium text-slate-300 mb-1">Título da tarefa *</label>
                            <input type="text" id="todo-title" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Ex: Estudar JavaScript">
                        </div>
                        <div>
                            <label for="todo-type" class="block text-sm font-medium text-slate-300 mb-1">Tipo *</label>
                            <select id="todo-type" required class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all appearance-none">
                                <option value="Trabalho">Trabalho</option>
                                <option value="Pessoal">Pessoal</option>
                                <option value="Estudos">Estudos</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="todo-desc" class="block text-sm font-medium text-slate-300 mb-1">Descrição (opcional)</label>
                        <textarea id="todo-desc" rows="2" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all resize-none" placeholder="Detalhes adicionais..."></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-6 rounded-lg transition-colors duration-200 shadow-lg shadow-indigo-500/25">
                            Adicionar Tarefa
                        </button>
                    </div>
                </form>
            </section>

            <!-- Lista de Tarefas -->
            <section class="glass p-6 rounded-2xl shadow-lg mb-8">
                <h2 class="text-lg font-semibold text-white mb-4">Suas Tarefas</h2>
                <div id="todo-list" class="flex flex-col gap-4">
                    <!-- Cards de tarefas -->
                </div>
                <div id="empty-state" class="hidden text-center py-10">
                    <p class="text-slate-400">Nenhuma tarefa cadastrada ainda.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
